version: '3.8'

services:
  mysql_db:
    image: mysql:8.0.22
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: ticket_app
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 10s
    networks:
      - app-network

  java_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: java_app
    ports:
      - "8080:8080"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge